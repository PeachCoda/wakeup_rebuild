<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a7f1fc" />
    <meta name="application-name" content="FakeUp" />
    <meta name="apple-mobile-web-app-title" content="FakeUp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>FakeUp</title>
    <link rel="icon" href="./favicon.ico?v=fakeup-icon-3" sizes="any" />
    <link rel="icon" type="image/png" href="./assets/favicon-192.png?v=fakeup-icon-3" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=fakeup-icon-3" />
    <link rel="manifest" href="./manifest.json?v=fakeup-pwa-2" />
    <style>html,body{margin:0;background:#c8f6fd;}</style>
    <link rel="stylesheet" href="./styles.css?v=fakeup-ui-23" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="课表侧栏">
        <div class="brand">
          <div class="brand-mark">F</div>
          <div>
            <h1>FakeUp</h1>
            <p>只保留课表本体</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">
            <span>当前课表</span>
            <button class="icon-button" id="newScheduleBtn" type="button" title="新建课表" aria-label="新建课表">+</button>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </section>

        <section class="panel today-panel">
          <div class="panel-title">
            <span>今日课程</span>
            <span id="todayBadge" class="soft-badge"></span>
          </div>
          <div id="todayCourses" class="today-list"></div>
        </section>
      </aside>

      <main class="main">
        <header class="topbar">

          <div class="term-summary">
            <button class="week-select-wrap" id="weekPickerBtn" type="button" aria-haspopup="dialog" aria-label="选择周数">
              <span id="weekTitle">第 1 周</span>
              <span class="week-chevron" aria-hidden="true">›</span>
            </button>
            <select id="weekSelect" class="sr-only" aria-label="选择周数"></select>
            <div class="eyebrow" id="dateRangeText"></div>
          </div>
          <div class="topbar-actions">
            <button class="menu-button" id="topbarMenuBtn" type="button" aria-label="打开课表菜单" aria-haspopup="true" aria-expanded="false">
              <span></span><span></span><span></span>
            </button>
            <div class="topbar-menu" id="topbarMenu" hidden>
              <button class="menu-row" id="toggleOtherWeekBtn" type="button">显示非本周课程</button>
              <button class="menu-row" id="currentWeekBtn" type="button">返回本周课表</button>
              <button class="menu-row" id="openSignInBtn" type="button">上课啦签到</button>
              <button class="menu-row" id="exportImageBtn" type="button">导出课表图片</button>
              <button class="menu-row" id="openImportBtn" type="button">导入 PDF</button>
            </div>
            <input id="pdfFileInput" class="sr-only" type="file" accept="application/pdf,.pdf" />

          </div>
        </header>

        <div class="week-strip" id="weekStrip"></div>

        <section class="timetable-wrap" aria-label="周课表">
          <div class="timetable" id="timetable"></div>
        </section>
      </main>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

    <section class="bottom-sheet" id="courseSheet" aria-label="课程详情" hidden>
      <div class="sheet-handle"></div>
      <div id="courseDetail"></div>
    </section>

    <div class="signin-backdrop" id="signinBackdrop" hidden></div>
    <section class="signin-panel" id="signinPanel" aria-label="上课啦签到" hidden>
      <header class="signin-head">
        <div>
          <p class="eyebrow">上课啦</p>
          <h3>密令签到</h3>
        </div>
        <button class="icon-button" id="closeSignInBtn" type="button" aria-label="关闭">×</button>
      </header>
      <div class="signin-current" id="signinCurrentCourse">正在判断当前课程…</div>
      <div class="signin-status" id="signinStatus">正在检查签到后端…</div>
      <div class="signin-login-grid" id="signInLoginFields">
        <label class="signin-field">
          <span>学号</span>
          <input id="signInUsernameInput" inputmode="numeric" autocomplete="username" placeholder="第一次输入一次" />
        </label>
        <label class="signin-field">
          <span>密码</span>
          <input id="signInPasswordInput" type="password" autocomplete="current-password" placeholder="统一身份认证密码" />
        </label>
      </div>
      <label class="signin-field" id="signInCodeField" hidden>
        <span>密令</span>
        <input id="signInCodeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="老师给的签到密令" />
      </label>
      <div class="signin-actions signin-actions-single">
        <button class="primary-button" id="signInAccountLoginBtn" type="button">登录并保存</button>
        <button class="primary-button" id="signInSubmitBtn" type="button" hidden>提交密令</button>
      </div>
    </section>


    <dialog id="settingsDialog" class="dialog">
      <form method="dialog" id="settingsForm" class="dialog-card">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">设置</p>
            <h3>课表配置</h3>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </header>

        <div class="form-grid compact-form">
          <label class="field field-wide">
            <span>课表名称</span>
            <input id="settingName" required maxlength="24" />
          </label>

          <label class="field">
            <span>开学日期</span>
            <input id="settingStartDate" type="date" required />
          </label>

          <label class="field">
            <span>格子高度</span>
            <input id="settingCellHeight" type="number" min="72" max="96" required />
          </label>
        </div>

        <footer class="dialog-actions">
          <button class="plain-button danger" id="deleteScheduleBtn" type="button">删除课表</button>
          <div class="action-spacer"></div>
          <button class="plain-button" value="cancel" type="submit">取消</button>
          <button class="primary-button" id="saveSettingsBtn" type="button">保存设置</button>
        </footer>
      </form>
    </dialog>

    <section class="pdf-debug-panel" id="pdfDebugPanel" hidden aria-label="PDF 解析 JSON">
      <div class="pdf-debug-head">
        <strong>PDF list JSON</strong>
        <button id="closePdfDebugBtn" type="button">关闭</button>
      </div>
      <pre id="pdfDebugText"></pre>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js?v=fakeup-pdf-54"></script>
  </body>
</html>
