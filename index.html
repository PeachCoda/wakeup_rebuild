<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FakeUp</title>
    <link rel="icon" href="./favicon.ico?v=fakeup-icon-2" sizes="any" />
    <link rel="icon" type="image/png" href="./assets/favicon-192.png?v=fakeup-icon-2" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png?v=fakeup-icon-2" />
    <link rel="stylesheet" href="./styles.css?v=fakeup-ui-3" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="课表侧栏">
        <div class="brand">
          <div class="brand-mark">F</div>
          <div>
            <h1>FakeUp</h1>
            <p>只保留课表本体</p>
          </div>
        </div>

        <section class="panel">
          <div class="panel-title">
            <span>当前课表</span>
            <button class="icon-button" id="newScheduleBtn" type="button" title="新建课表" aria-label="新建课表">+</button>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </section>

        <section class="panel today-panel">
          <div class="panel-title">
            <span>今日课程</span>
            <span id="todayBadge" class="soft-badge"></span>
          </div>
          <div id="todayCourses" class="today-list"></div>
        </section>
      </aside>

      <main class="main">
        <header class="app-titlebar">
          <strong>FakeUp</strong>
        </header>

        <header class="topbar">

          <div class="term-summary">
            <button class="week-select-wrap" id="weekPickerBtn" type="button" aria-haspopup="dialog" aria-label="选择周数">
              <span id="weekTitle">第 1 周</span>
              <span class="week-chevron" aria-hidden="true">›</span>
            </button>
            <select id="weekSelect" class="sr-only" aria-label="选择周数"></select>
            <div class="eyebrow" id="dateRangeText"></div>
          </div>
          <div class="topbar-actions">
            <label class="other-week-toggle" title="显示非本周课程">
              <input id="headerShowOtherWeek" type="checkbox" />
              <span>非本周</span>
            </label>
            <button class="week-pill" id="currentWeekBtn" type="button">本周</button>

            <button class="icon-button utility-action" id="openImportBtn" type="button" title="导入导出" aria-label="导入导出">⇅</button>

          </div>
        </header>

        <div class="week-strip" id="weekStrip"></div>

        <section class="timetable-wrap" aria-label="周课表">
          <div class="timetable" id="timetable"></div>
        </section>
      </main>
    </div>

    <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>

    <section class="bottom-sheet" id="courseSheet" aria-label="课程详情" hidden>
      <div class="sheet-handle"></div>
      <div id="courseDetail"></div>
    </section>

    <dialog id="settingsDialog" class="dialog">
      <form method="dialog" id="settingsForm" class="dialog-card">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">设置</p>
            <h3>课表配置</h3>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </header>

        <div class="form-grid compact-form">
          <label class="field field-wide">
            <span>课表名称</span>
            <input id="settingName" required maxlength="24" />
          </label>

          <label class="field">
            <span>开学日期</span>
            <input id="settingStartDate" type="date" required />
          </label>

          <label class="field">
            <span>格子高度</span>
            <input id="settingCellHeight" type="number" min="72" max="132" required />
          </label>
        </div>

        <footer class="dialog-actions">
          <button class="plain-button danger" id="deleteScheduleBtn" type="button">删除课表</button>
          <div class="action-spacer"></div>
          <button class="plain-button" value="cancel" type="submit">取消</button>
          <button class="primary-button" id="saveSettingsBtn" type="button">保存设置</button>
        </footer>
      </form>
    </dialog>

    <dialog id="importDialog" class="dialog">
      <form method="dialog" class="dialog-card">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">数据</p>
            <h3>导入导出</h3>
          </div>
          <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </header>

        <div class="import-tools">
          <p>推荐导入方式：在杭电教务系统个人课表页点击“输出 PDF”，然后在这里选择 PDF 导入。PDF 会在浏览器本地解析，不上传文件，也不保存教务账号密码。JSON 导入保留为备份方式。</p>
          <div class="import-helper">
            <button class="primary-button" id="importPdfBtn" type="button">导入 PDF</button>
            <input id="pdfFileInput" class="sr-only" type="file" accept="application/pdf,.pdf" />
            <span>在教务系统点击“输出 PDF”保存课表文件，然后选择这个 PDF。</span>
          </div>
          <textarea id="importText" rows="10" placeholder="备份方式：粘贴 FakeUp 课表 JSON、本站导出的 JSON，或旧 HTML"></textarea>
          <div class="dialog-actions compact-actions">
            <button class="plain-button" id="exportBtn" type="button">导出 JSON</button>
            <button class="plain-button" id="importBtn" type="button">导入 JSON</button>
            <button class="plain-button" id="copyHduCollectorBtn" type="button">复制采集脚本</button>
            <button class="primary-button" id="importHduBtn" type="button">导入文本</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js?v=fakeup-pdf-1"></script>
  </body>
</html>
